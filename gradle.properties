# ---- Project version: SINGLE SOURCE OF TRUTH ----
# All three modules read these. They ship and install together, so a version
# skew between them would be meaningless and confusing - bump here, once, and
# they stay in lockstep. Tag the repo to match (v<versionName>).
#
# versionName is semver. versionCode must increase by 1 on every release
# Android will install over: it is what the platform compares, not the name.
forexdialVersionName=1.1.1
forexdialVersionCode=3

android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
